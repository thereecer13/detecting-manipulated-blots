# Rulebook v2 (2026-11-06): v1's three rules plus eight rules proposed after test 2 and
# accepted by the project's biologist. Rules A5 (too small to judge), B5 (smear direction)
# and B6 (biological plausibility) were proposed too and are still under consideration.
# Frozen before test 3. Test 2 counts as development data from here on (some rules cite
# test 2 images), so test 3 uses papers and Richardson images not used in the pilot or test 2.

# --- v1 rules (unchanged) ---
- id: R1
  kind: flag
  name: Duplicated bands
  rule: >
    Take the outline shape of each band and compare it with every other band within the image.
    If the similarity is above 0.95, this is suspicious. Suspicion should increase if more than
    one band is similar to another within the same image.
- id: R2
  kind: flag
  name: Splices and sharp transitions
  rule: >
    Look for continuous segments where there is a sharp transition in pixel brightness outside
    bands, especially if they are perfectly straight lines.
- id: R3
  kind: flag
  name: Background painting
  rule: >
    Use the method Richardson uses where you increase contrast, and look for blotchy patches
    that greatly contrast an otherwise smooth background.

# --- clearing rules (what is NOT manipulation) ---
- id: C1
  kind: clear
  name: Disclosed splices are legitimate
  rule: >
    A visible white gap or a drawn separator line between strips marks a disclosed splice,
    which journals allow; it is not manipulation. An undisclosed splice has no gap: two
    backgrounds meet directly with a brightness step.
- id: C2
  kind: clear
  name: Similar band shape alone is not evidence of duplication
  rule: >
    Evenly loaded bands (especially loading controls such as actin or GAPDH) are naturally
    oval and alike. A copy is shown by identical fine detail: the same specks, scratches,
    dust or noise pattern in and around the band.
- id: C3
  kind: clear
  name: A background that is flat everywhere is contrast adjustment, not painting
  rule: >
    Painting is a local flat patch inside an otherwise grainy background. A background that is
    uniformly flat white across the whole blot means the figure was over-adjusted.
- id: C4
  kind: clear
  name: Compression artifacts are not edits
  rule: >
    Square 8x8-pixel blocks come from JPEG compression, and stepped contour lines come from
    saving with few gray levels. Neither is evidence of editing.

# --- additional flag rules ---
- id: F1
  kind: flag
  name: Bands should follow the gel's shape
  rule: >
    Bands of the same protein sit on a smooth curve across lanes (the gel's smile or frown).
    A lane, or a block of lanes, whose band jumps up or down abruptly suggests a splice even
    when no seam is visible.
- id: F2
  kind: flag
  name: Each lane should have the same grain
  rule: >
    One exposure gives one noise texture. A lane whose grain is coarser, finer or differently
    oriented than its neighbours came from a different image.
- id: F3
  kind: flag
  name: A box around a band means it was pasted
  rule: >
    A faint rectangle of slightly different background around a single band indicates a
    pasted patch.
- id: F4
  kind: flag
  name: A band cut off by a straight line was trimmed
  rule: >
    Real band edges are soft. A band that ends abruptly along a straight line was cut.
